<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인천 강사공고 모음</title>
<style>
  :root { --pink:#f6d6dc; --pink2:#e9a9b5; --ink:#1a1a1a; --mute:#777; --line:#eee; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:#fff; }
  header { background:var(--pink); padding:28px 20px 20px; }
  header h1 { margin:0 0 6px; font-size:24px; }
  header p { margin:0; color:#555; font-size:14px; }
  main { max-width:900px; margin:0 auto; padding:16px 16px 60px; }
  .tabs { display:flex; gap:6px; border-bottom:2px solid var(--ink); margin-top:8px; }
  .tab { border:0; background:none; padding:10px 14px; font-size:15px; cursor:pointer; color:var(--mute); border-radius:8px 8px 0 0; }
  .tab.on { background:var(--ink); color:#fff; font-weight:700; }
  .tab b { font-weight:700; margin-left:4px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .bar input { flex:1 1 220px; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:15px; }
  .chip { border:1px solid var(--ink); background:#fff; border-radius:999px; padding:7px 14px; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--ink); color:#fff; }
  .item { display:flex; gap:12px; align-items:flex-start; border-bottom:1px solid var(--line); padding:14px 2px 14px 10px; border-left:4px solid transparent; }
  .item.plan { border-left-color:var(--pink2); background:#fff8f9; }
  .item.applied { border-left-color:#2e8b57; background:#f4fbf6; }
  .item.hold { border-left-color:#c9a227; background:#fdfaf0; }
  .act.holdOn { background:#c9a227; border-color:#c9a227; color:#fff; font-weight:700; }
  .act.doneOn { background:#2e8b57; border-color:#2e8b57; color:#fff; font-weight:700; }
  .item.hidden { opacity:.55; }
  .body { flex:1; min-width:0; }
  .item a { color:var(--ink); font-weight:600; text-decoration:none; font-size:16px; line-height:1.4; }
  .item a:hover { text-decoration:underline; }
  .item a.drv { font-size:13px; font-weight:700; color:#b03a57; }
  .meta { color:var(--mute); font-size:13px; margin-top:4px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:6px; background:#f2f2f2; margin-right:6px; }
  .tag.mine { background:var(--pink); }
  .dd { font-weight:700; color:#c0392b; }
  .acts { display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .act { border:1px solid #ccc; background:#fff; border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .act.planOn { background:var(--pink2); border-color:var(--pink2); color:#fff; font-weight:700; }
  .act:hover { border-color:var(--ink); }
  .empty { color:var(--mute); padding:30px 0; text-align:center; }
  .note { color:var(--mute); font-size:12px; margin-top:24px; }
  .note button { font-size:12px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:999px; font-size:14px; display:none; }
  .toast button { background:none; border:0; color:var(--pink); font-weight:700; margin-left:10px; cursor:pointer; font-size:14px; }
  @media (max-width:560px) { .item { flex-direction:column; } .acts { flex-direction:row; } }
  .pools { margin-top:28px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .pools summary { cursor:pointer; font-weight:700; }
  .pools li { margin:6px 0; } .pools a { color:var(--ink); }
</style>
</head>
<body>
<header>
  <h1>인천 강사공고 모음</h1>
  <p style="margin:4px 0 8px"><a href="grants.html" style="color:#1a1a1a">→ 지원사업·공모 공고 보기</a></p>
  <p id="updated">불러오는 중…</p>
</header>
<main>
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="open">공고<b id="nOpen"></b></button>
    <button class="tab" data-v="plan">⭐ 지원예정<b id="nPlan"></b></button>
    <button class="tab" data-v="hold">⏸ 지원보류<b id="nHold"></b></button>
    <button class="tab" data-v="applied">✅ 지원완료<b id="nApplied"></b></button>
    <button class="tab" data-v="hidden">숨긴 공고<b id="nHidden"></b></button>
  </div>
  <div class="bar">
    <input id="q" placeholder="검색 (예: 미술, 연수구, 주민자치)">
    <button class="chip on" id="hideClosed">마감 지난 공고 숨기기</button>
  </div>
  <div class="bar" id="cats"></div>
  <div id="list"></div>
  <p class="note"><span id="syncNote"></span>
    <span id="xfer">다른 기기로 옮기려면 <button id="exp">표시 내보내기</button> <button id="imp">가져오기</button></span></p>
  <details class="pools" id="pools" style="display:none">
    <summary>📌 상시 강사풀 등록처 (공고 없이 미리 등록)</summary>
    <p class="note" id="poolsNote"></p>
    <ul id="poolsList"></ul>
  </details>
</main>
<script src="config.js"></script>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo">되돌리기</button></div>
<script>
const KEY = 'incheon-alerts-marks-v1';
const today = new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Seoul'})); today.setHours(0,0,0,0);
let all = [], cat = '전체', hide = true, view = 'open', marks = {}, lastUndo = null, toastT;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const keyOf = p => (p.title || '').replace(/\[[^\]]*공고[^\]]*\]/g, '').replace(/[\s\p{P}\p{S}_]+/gu, '').toLowerCase();

const API = window.MARKS_API || '', SYNCED = 'incheon-alerts-synced-v1';
let sync = API ? 'loading' : 'off';

function loadMarks() { try { marks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { marks = {}; } }
function saveMarks() { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} }
function toast(msg, undo) {
  $('#toastMsg').textContent = msg; $('#undo').style.display = undo ? '' : 'none'; $('#toast').style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => $('#toast').style.display = 'none', 4000);
}
async function post(body) {
  const r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
  const d = await r.json(); if (!d.ok) throw new Error(d.error || 'fail'); return d;
}
function payload(k, m) {
  return {key: k, state: m ? m.state : '', title: m?.title || '', url: m?.url || '', org: m?.org || '', deadline: m?.deadline || '', at: m?.at || ''};
}
function pushMark(k) {
  if (!API) return;
  const send = () => post({action: 'mark', ...payload(k, marks[k])});
  send().catch(() => setTimeout(() => send().catch(() => setTimeout(() => send().catch(() =>
    toast('저장에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.')), 8000)), 3000));
}
// 공용 저장소(구글시트)에서 표시를 읽어 온다. 이 기기에만 있던 예전 표시는 처음 한 번 올려 준다.
async function syncMarks() {
  if (!API) return;
  try {
    const d = await (await fetch(API + '?action=marks&t=' + Date.now())).json();
    const server = d.marks || {};
    let first = false; try { first = !localStorage.getItem(SYNCED); } catch (e) {}
    if (first) {
      try { if (Object.keys(marks).length) localStorage.setItem(KEY + '-backup', JSON.stringify(marks)); } catch (e) {}
      const up = Object.keys(marks).filter(k => !server[k]);
      if (up.length) { await post({action: 'marks', items: up.map(k => payload(k, marks[k]))}); up.forEach(k => server[k] = marks[k]); }
      try { localStorage.setItem(SYNCED, '1'); } catch (e) {}
      if (up.length) toast(`이 기기의 표시 ${up.length}개를 모든 기기에 공유했어요`);
    }
    marks = server; saveMarks(); sync = 'on'; addGhosts();
  } catch (e) { sync = 'fail'; }
  renderNote(); render();
}
// 목록에서 빠진(오래돼 정리된) 지원예정·지원완료 공고도 기록으로 남겨 보여 준다
function addGhosts() {
  const have = new Set(all.map(keyOf));
  Object.entries(marks).forEach(([k, m]) => {
    if (!k.startsWith('g:') && ['plan', 'applied', 'hold'].includes(m.state) && !have.has(k) && m.title)
      all.push({title: m.title, url: m.url || '#', org: m.org || '', deadline: m.deadline || '', category: '지난 공고', first_seen: '-', via: '기록', ghost: true});
  });
}
function renderNote() {
  const x = document.getElementById('xfer'); if (x) x.style.display = sync === 'on' ? 'none' : '';
  $('#syncNote').innerHTML = sync === 'on'
    ? '⭐ 지원예정·숨기기 표시는 누르는 즉시 구글시트에 저장돼 <b>모든 기기에서 같이</b> 보여요. ⭐ 공고의 첨부(공고문·지원서)는 1시간 안에 구글드라이브 「강사지원DB/공고첨부」에 자동 저장돼요.'
    : sync === 'loading' ? '표시 불러오는 중…'
    : sync === 'fail' ? '표시를 불러오지 못했어요. 지금은 이 브라우저에 저장된 표시만 보여요.'
    : '⭐ 지원예정·숨기기 표시는 지금 쓰는 이 브라우저에 저장돼요.';
}
function setMark(p, state) {
  const k = keyOf(p), prev = marks[k] ? {...marks[k]} : null;
  if (state) marks[k] = {...(prev || {}), state, title: p.title, url: p.url, org: p.org, deadline: p.deadline, at: new Date().toISOString().slice(0,10)};
  else delete marks[k];
  saveMarks(); pushMark(k);
  lastUndo = () => { if (prev) marks[k] = prev; else delete marks[k]; saveMarks(); pushMark(k); render(); };
  toast(state === 'plan' ? (prev?.state === 'applied' || prev?.state === 'hold' ? '지원예정으로 되돌렸어요' : API ? '지원예정에 넣었어요 · 첨부는 1시간 안에 드라이브로 저장돼요' : '지원예정에 넣었어요') : state === 'applied' ? '지원완료로 옮겼어요 ✅' : state === 'hold' ? '지원보류로 옮겼어요 ⏸ (첨부는 그대로 저장돼요)' : state === 'hidden' ? '숨겼어요' : '표시를 지웠어요', true);
  render();
}
function fileInfo(m) {
  if (!m || !['plan', 'applied', 'hold'].includes(m.state) || !API) return '';
  if (m.folder) return ` · <a class="drv" href="${esc(m.folder)}" target="_blank" rel="noopener">📁 드라이브에 저장됨</a>`;
  if (m.saved === '첨부 없음') return ' · 첨부파일 없음';
  if (m.note && (m.tries || 0) >= 6) return ` · 첨부 저장 실패 (${esc(m.note)})`;
  return ' · 📎 첨부 저장 대기 중';
}
function dday(d) {
  if (!d) return '';
  const n = Math.round((new Date(d + 'T00:00:00') - today) / 864e5);
  return n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : '마감';
}
function stateOf(p) { return marks[keyOf(p)]?.state || ''; }

function render() {
  const q = $('#q').value.trim();
  const counts = {open: 0, plan: 0, applied: 0, hold: 0, hidden: 0};
  all.forEach(p => { const s = stateOf(p);
    if (s === 'hidden') counts.hidden++; else if (s === 'applied') counts.applied++; else if (s === 'hold') counts.hold++; else if (!p.ghost) { counts.open++; if (s === 'plan') counts.plan++; } else if (s === 'plan') counts.plan++; });
  $('#nOpen').textContent = counts.open; $('#nPlan').textContent = counts.plan; $('#nApplied').textContent = counts.applied; $('#nHold').textContent = counts.hold; $('#nHidden').textContent = counts.hidden;

  const rows = all.filter(p => {
    const s = stateOf(p);
    if (view === 'open' && (s === 'hidden' || s === 'applied' || s === 'hold' || p.ghost)) return false;
    if (view === 'plan' && s !== 'plan') return false;
    if (view === 'applied' && s !== 'applied') return false;
    if (view === 'hold' && s !== 'hold') return false;
    if (view === 'hidden' && s !== 'hidden') return false;
    if (cat !== '전체' && (cat === '내 분야' ? !p.mine : p.category !== cat)) return false;
    if (hide && !['plan', 'applied', 'hold'].includes(view) && p.deadline && dday(p.deadline) === '마감') return false;
    return !q || (p.title + p.org + p.via + p.category + (p.kind || '')).includes(q);
  });
  if (view === 'open') rows.sort((a, b) => (stateOf(b) === 'plan') - (stateOf(a) === 'plan'));

  $('#list').innerHTML = rows.length ? rows.map((p, i) => {
    const s = stateOf(p);
    return `<div class="item ${s}" data-i="${all.indexOf(p)}">
      <div class="body">
        <span class="tag ${p.mine ? 'mine' : ''}">${esc(p.category)}</span>
        <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        <div class="meta">${esc(p.org)}${p.kind ? ' · ' + esc(p.kind) : ''} · 마감 ${esc(p.deadline || '미기재')} <span class="dd">${dday(p.deadline)}</span> · 처음 본 날 ${esc(p.first_seen)} · ${esc(p.via)}${s && marks[keyOf(p)]?.at ? (s === 'applied' ? ' · 지원한 날 ' : s === 'hold' ? ' · 보류한 날 ' : ' · 표시한 날 ') + esc(marks[keyOf(p)].at) : ''}${fileInfo(marks[keyOf(p)])}</div>
      </div>
      <div class="acts">
        ${s === 'hidden'
          ? `<button class="act" data-a="">다시 보기</button>`
          : s === 'applied'
          ? `<button class="act doneOn" data-a="plan" title="누르면 지원예정으로 되돌려요">✅ 지원완료</button>`
          : s === 'hold'
          ? `<button class="act holdOn" data-a="plan" title="누르면 지원예정으로 되돌려요">⏸ 지원보류</button>
             <button class="act" data-a="hidden">숨기기</button>`
          : `<button class="act ${s === 'plan' ? 'planOn' : ''}" data-a="${s === 'plan' ? '' : 'plan'}">${s === 'plan' ? '★ 지원예정' : '☆ 지원예정'}</button>
             ${s === 'plan' ? `<button class="act" data-a="applied">✅ 지원완료</button>
             <button class="act" data-a="hold" title="일정이 겹치는 등 잠시 미뤄 둘 때">⏸ 지원보류</button>` : ''}
             <button class="act" data-a="hidden">숨기기</button>`}
      </div>
    </div>`;
  }).join('') : `<div class="empty">${view === 'plan' ? '지원예정으로 표시한 공고가 없어요. 공고 옆 ☆ 지원예정을 눌러 보세요.' : view === 'applied' ? '지원완료한 공고가 없어요. ⭐ 지원예정 공고에서 ✅ 지원완료를 눌러 보세요.' : view === 'hold' ? '보류한 공고가 없어요. 일정이 겹치면 ⭐ 지원예정 공고에서 ⏸ 지원보류를 눌러 보세요.' : view === 'hidden' ? '숨긴 공고가 없어요.' : '조건에 맞는 공고가 없어요.'}</div>`;
}

$('#list').addEventListener('click', e => {
  const b = e.target.closest('button.act'); if (!b) return;
  const p = all[+b.closest('.item').dataset.i]; setMark(p, b.dataset.a || null);
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return; view = b.dataset.v;
  [...$('#tabs').children].forEach(t => t.classList.toggle('on', t === b)); render();
});
$('#undo').onclick = () => { if (lastUndo) lastUndo(); lastUndo = null; $('#toast').style.display = 'none'; };
$('#q').oninput = render;
$('#hideClosed').onclick = () => { hide = !hide; $('#hideClosed').classList.toggle('on', hide); render(); };
$('#exp').onclick = () => {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(marks))));
  try { navigator.clipboard.writeText(code); } catch (e) {}
  prompt('이 글자를 복사해서 다른 기기의 "가져오기"에 붙여 넣으세요 (클립보드에도 복사됨)', code);
};
$('#imp').onclick = () => {
  const code = prompt('다른 기기에서 내보낸 글자를 붙여 넣으세요'); if (!code) return;
  try { const got = JSON.parse(decodeURIComponent(escape(atob(code.trim())))); Object.assign(marks, got); saveMarks();
    if (API) post({action: 'marks', items: Object.keys(got).map(k => payload(k, marks[k]))}).catch(() => {});
    render(); alert('가져왔어요'); }
  catch (e) { alert('형식이 맞지 않아요. 내보내기 글자를 그대로 붙여 넣어 주세요.'); }
};

loadMarks(); renderNote();
fetch('pools.json?' + Date.now()).then(r => r.json()).then(d => {
  const esc2 = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('poolsNote').textContent = d.note || '';
  document.getElementById('poolsList').innerHTML = d.pools.map(p => `<li><a href="${esc2(p.url)}" target="_blank" rel="noopener">${esc2(p.name)}</a> · ${esc2(p.area)}</li>`).join('');
  document.getElementById('pools').style.display = '';
}).catch(() => {});
fetch('data.json?' + Date.now()).then(r => r.json()).then(d => {
  all = d.postings;
  $('#updated').textContent = `마지막 업데이트 ${d.updated} · 공고 ${all.length}건 · 매일 아침 자동 갱신`;
  const cats = ['전체', '내 분야', ...new Set(all.map(p => p.category))];
  $('#cats').innerHTML = cats.map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('#cats').onclick = e => { if (!e.target.dataset.c) return; cat = e.target.dataset.c;
    [...$('#cats').children].forEach(b => b.classList.toggle('on', b.dataset.c === cat)); render(); };
  render(); syncMarks();
}).catch(() => { $('#updated').textContent = '아직 데이터가 없어요. 첫 실행 후에 채워져요.'; });
</script>
</body>
</html>
