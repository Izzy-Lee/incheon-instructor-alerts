name: 인천 강사공고 수집

on:
  schedule:
    - cron: "43 21 * * *"   # 매일 06:43 KST (UTC 21:43)
    - cron: "43 8 * * *"    # 매일 17:43 KST (UTC 08:43) — 오후 6시 전에 저녁 공고 반영
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 가능

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 공고 수집
        run: python scripts/collect.py

      - name: 지원사업 공고 수집
        continue-on-error: true
        env:
          PROFILE: grants
        run: python scripts/collect.py

      - name: 지원사업 예고 캘린더
        continue-on-error: true
        run: python scripts/forecast.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports docs/data.json docs/grants.json docs/forecast.ics docs/forecast.json
          git diff --cached --quiet || git commit -m "공고 업데이트 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push && exit 0; sleep 5; done
          exit 1

      - name: 이슈로 알림
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat out/should_post)" != "yes" ]; then echo "새 소식 없음"; exit 0; fi
          gh label create "공고" --color F6D6DC --description "강사 공고 일일 요약" 2>/dev/null || true
          BODY="$(cat out/issue.md)

          전체 목록: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          gh issue create \
            --title "$(cat out/issue_title.txt)" \
            --body "$BODY" \
            --label "공고" \
            --assignee "${{ github.repository_owner }}"

      - name: 지원사업 이슈로 알림
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f out/grants/should_post ] || [ "$(cat out/grants/should_post)" != "yes" ]; then echo "새 지원사업 없음"; exit 0; fi
          gh label create "지원사업" --color 1A1A1A --description "지원사업·공모 일일 요약" 2>/dev/null || true
          BODY="$(cat out/grants/issue.md)

          전체 목록: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/grants.html"
          gh issue create \
            --title "$(cat out/grants/issue_title.txt)" \
            --body "$BODY" \
            --label "지원사업" \
            --assignee "${{ github.repository_owner }}"
