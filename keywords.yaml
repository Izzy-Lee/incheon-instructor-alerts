# 제목에 아래 단어가 하나라도 있으면 "강사 공고"로 봅니다.
include:
  - 강사
  - 강좌
  - 강의
  - 방과후
  - 프로그램 운영
  - 교육 프로그램
  - 문화예술교육
  - 예술교육
  - 튜터
  - 지도자
  - 해설사
  - 체험 운영
  - 교육 운영

# 인천교육청 게시판의 "모집직종"이 아래 중 하나면 제목과 상관없이 강사 공고로 봅니다.
include_kinds:
  - 시간강사
  - 예체능강사
  - 방과후강사
  - 외국어전문강사
  - 보결강사
  - 교과보충학습

# 제목에 아래 단어가 있으면 뺍니다 (결과 발표 등).
exclude:
  - 합격자
  - 서류전형 결과
  - 서류 전형 결과
  - 전형 결과
  - 면접시행
  - 면접 시행
  - 면접시험
  - 최종합격
  - 결과 공고
  - 결과 안내
  - 채용 취소
  - 모집 취소

# 분야 분류 (위에서부터 먼저 맞는 것). "내 분야"는 맨 위에 따로 모아 보여줍니다.
categories:
  - name: 미술·공예
    mine: true
    words: [미술, 공예, 그림, 드로잉, 수채, 회화, 캘리, 디자인, 만들기, 도예, 아트, 컬러, 색채, 일러스트, 웹툰, 만화, 팝아트, 민화, 어반스케치]
  - name: 체육
    words: [체육, 수영, 요가, 필라테스, 헬스, 댄스, 탁구, 배드민턴, 축구, 스포츠]
  - name: 주민자치·평생교육
    words: [주민자치, 평생, 문화센터, 도서관, 배움터, 복지관, 청소년]
  - name: 학교·방과후
    words: [학교, 초등, 중학, 고등, 방과후, 돌봄, 유치원, 교육청, 교육지원청]
  - name: 기타
    words: []
