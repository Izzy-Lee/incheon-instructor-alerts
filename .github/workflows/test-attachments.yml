name: 첨부 찾기 시험 (임시)
on:
  push:
    branches: [test-attachments]
    paths: [.github/workflows/test-attachments.yml, scripts/attachments.py]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: |
          python scripts/attachments.py --test \
            "https://www.ice.go.kr/ice/na/ntt/selectNttInfo.do?mi=10997&bbsId=1981&nttSn=3389234" \
            "https://www.incheon.go.kr/jobs/main/recruit/public/view.do?rcrut_info_sn=135230" \
            "https://www.michuhol.go.kr/main/board/view.do?sq=363555&board_code=job_noti&search=eyJib2FyZF9jb2RlIjoiam9iX25vdGkifQ==" \
            "https://eminwon.yeonsu.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?not_ancmt_mgt_no=46391&pageIndex=1&jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&subCheck=Y&ofr_pageSize=15&not_ancmt_se_code=05&initValue=Y&countYn=Y&not_ancmt_sj=&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst" \
            "https://www.icbp.go.kr/main/eminwon/eminwonJobDetail.do?mgt_no=51642" \
            "https://www.yeongjong.go.kr/main/pst/view.do?pst_id=mn_rcrut_ntc&pst_sn=338165&search=c2xUTFRHb29DZVZtaUxhRGVtSk1XQT09" \
            > test-result.txt 2>&1 || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-result.txt && git commit -m "시험 결과" && git push
