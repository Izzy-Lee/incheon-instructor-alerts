name: 지원예정 첨부 드라이브 저장

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다
  push:                     # 설정·코드가 바뀌면 바로 한 번 실행
    branches: [main]
    paths: [docs/config.js, scripts/attachments.py, .github/workflows/attachments.yml]
  workflow_dispatch:
    inputs:
      test_urls:
        description: "시험용: 공고 주소(띄어쓰기로 여러 개). 적으면 업로드 없이 첨부만 찾아 봄"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: attachments
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 첨부 찾기 시험
        if: ${{ github.event.inputs.test_urls != '' }}
        env:
          TEST_URLS: ${{ github.event.inputs.test_urls }}
        run: python scripts/attachments.py --test $TEST_URLS

      - name: 지원예정 첨부 받기
        if: ${{ github.event.inputs.test_urls == '' }}
        run: |
          if ! grep -q "script.google.com" docs/config.js; then echo "docs/config.js 에 웹앱 주소가 아직 없어요 — 건너뜀"; exit 0; fi
          python scripts/attachments.py

      - name: 받은 첨부 저장소에 올리기 (Apps Script 가 드라이브로 옮겨 감)
        if: ${{ github.event.inputs.test_urls == '' }}
        run: |
          [ -d inbox ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A inbox
          git diff --cached --quiet && exit 0
          git commit -m "지원예정 첨부 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
